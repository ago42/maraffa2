<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mareaffa in 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Nunito', sans-serif; background: #0f2b1d; color: #fff; height: 100vh; height: 100dvh; overflow: hidden; display: flex; justify-content: center; }
        
        .game-container { width: 100vw; height: 100vh; height: 100dvh; max-width: 450px; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; background: radial-gradient(circle, #1a4a32 0%, #091c13 100%); }
        
        /* Header compatto */
        .game-header { display: flex; flex-direction: column; gap: 4px; background: rgba(0, 0, 0, 0.5); padding: 6px 10px; border-radius: 10px; border: 1px solid rgba(255, 215, 0, 0.2); font-size: 0.8rem; }
        .header-row { display: flex; justify-content: space-between; align-items: center; }
        .valore { font-weight: 900; color: #ffd700; }
        
        .btn-reset { background: #8b0000; color: #fff; border: 1px solid #ffd700; padding: 3px 6px; border-radius: 5px; font-weight: bold; font-size: 0.7rem; cursor: pointer; }

        /* Area di gioco ridimensionata per mobile */
        .tavolo { flex: 1; display: flex; flex-direction: column; justify-content: space-between; margin: 5px 0; }
        
        .area-avversario { display: flex; justify-content: center; gap: 2px; min-height: 45px; }
        .carta-coperta { width: 30px; height: 45px; background: linear-gradient(135deg, #8b0000, #4a0000); border: 1px solid #ffd700; border-radius: 4px; }

        .area-centrale { display: flex; flex-direction: column; align-items: center; gap: 6px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .campo-carte { display: flex; justify-content: center; align-items: center; gap: 15px; width: 100%; }
        .slot-carta { width: 55px; height: 80px; border: 2px dashed rgba(255, 255, 255, 0.2); border-radius: 8px; display: flex; justify-content: center; align-items: center; }
        
        /* Carte più compatte */
        .carta { width: 55px; height: 80px; background: #fff8eb; color: #1a1a1a; border-radius: 8px; border: 2px solid #ccc; display: flex; flex-direction: column; justify-content: space-between; padding: 4px; font-size: 0.75rem; font-weight: 900; cursor: pointer; box-shadow: 0 3px 5px rgba(0,0,0,0.3); transition: transform 0.1s; flex-shrink: 0; }
        .carta.selezionata { transform: translateY(-10px); border-color: #ffd700; box-shadow: 0 0 12px #ffd700; }
        
        .area-propria { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; }
        .mano-scroll { width: 100%; overflow-x: auto; display: flex; gap: 6px; padding: 12px 2px 4px 2px; scrollbar-width: none; }
        .mano-scroll::-webkit-scrollbar { display: none; }

        .btn-azione { background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%); color: #000; border: none; padding: 10px 0; font-weight: 900; border-radius: 20px; font-size: 0.95rem; width: 100%; cursor: pointer; }
        .btn-azione:disabled { opacity: 0.3; }

        /* Modal Scelta Briscola NON coprente (permette di vedere la propria mano) */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); display: flex; justify-content: center; align-items: flex-start; padding-top: 50px; z-index: 100; pointer-events: auto; }
        .modal.hidden { display: none; }
        .modal-content { background: rgba(22, 62, 42, 0.95); padding: 12px; border-radius: 15px; border: 2px solid #ffd700; text-align: center; width: 90%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
        .grid-semi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .btn-seme { padding: 8px 4px; font-weight: 900; border-radius: 8px; background: #25543a; color: #fff; border: 1px solid #ffd700; font-size: 0.85rem; cursor: pointer; }
    </style>
</head>
<body>

    <div id="modal-briscola" class="modal hidden">
        <div class="modal-content">
            <h3 style="color:#ffd700; font-size: 1rem;">SCEGLI BRISCOLA</h3>
            <p style="font-size: 0.75rem; opacity: 0.8;">Guarda le tue carte sotto prima di scegliere</p>
            <div class="grid-semi">
                <button onclick="scegliBriscola('Denari')" class="btn-seme">♦ Denari</button>
                <button onclick="scegliBriscola('Coppe')" class="btn-seme">🍷 Coppe</button>
                <button onclick="scegliBriscola('Spade')" class="btn-seme">⚔ Spade</button>
                <button onclick="scegliBriscola('Bastoni')" class="btn-seme">🪵 Bastoni</button>
            </div>
        </div>
    </div>

    <div class="game-container">
        <header class="game-header">
            <div class="header-row">
                <div>Ruolo: <span id="mio-ruolo" class="valore">-</span></div>
                <div>Briscola: <span id="briscola-txt" class="valore">-</span></div>
                <button onclick="resetStanza()" class="btn-reset">Reset</button>
            </div>
            <div class="header-row" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 3px;">
                <div>Partita: <span id="punti-partita" class="valore">0 - 0</span></div>
                <div>Totale: <span id="punti-totali" class="valore">0 - 0</span></div>
            </div>
        </header>

        <main class="tavolo">
            <div class="area-avversario" id="mano-avversario"></div>

            <div class="area-centrale">
                <div style="font-size: 0.75rem; opacity: 0.8;">Mazzo: <span id="carte-mazzo" class="valore">0</span></div>
                <div class="campo-carte">
                    <div class="slot-carta" id="slot-g1"></div>
                    <div style="color:#ffd700; font-weight:900; font-size:0.8rem;">VS</div>
                    <div class="slot-carta" id="slot-g2"></div>
                </div>
            </div>

            <div class="area-propria">
                <div class="mano-scroll" id="mano-propria"></div>
                <button id="btn-gioca" onclick="inviaCarta()" class="btn-azione" disabled>GIOCA CARTA</button>
            </div>
        </main>
    </div>

    <script>
        let cartaSelezionata = null;
        let mioRuolo = 0;

        setInterval(aggiornaStato, 1000);
        document.addEventListener("DOMContentLoaded", aggiornaStato);

        async function aggiornaStato() {
            try {
                const res = await fetch('/api/stato');
                const stato = await res.json();
                mioRuolo = stato.mio_ruolo;
                renderizza(stato);
            } catch (err) {
                console.error("Errore sincronizzazione:", err);
            }
        }

        function renderizza(stato) {
            document.getElementById('mio-ruolo').textContent = mioRuolo ? `G${mioRuolo}` : 'Spettatore';
            document.getElementById('briscola-txt').textContent = stato.briscole || 'Scegli...';
            document.getElementById('carte-mazzo').textContent = stato.carte_rimaste_mazzo;

            // Aggiornamento Punteggi
            document.getElementById('punti-partita').textContent = `${stato.punti_g1 || 0} - ${stato.punti_g2 || 0}`;
            document.getElementById('punti-totali').textContent = `${stato.sommatot1 || 0} - ${stato.sommatot2 || 0}`;

            const chiDeveScegliere = (stato.turni % 2 === 0) ? 1 : 2;
            const modal = document.getElementById('modal-briscola');
            if (!stato.briscole && mioRuolo === chiDeveScegliere) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }

            renderSlot('slot-g1', stato.carta1_in_tavola);
            renderSlot('slot-g2', stato.carta2_in_tavola);

            const miaMano = (mioRuolo === 1) ? stato.mano_g1 : stato.mano_g2;
            const containerProprio = document.getElementById('mano-propria');
            containerProprio.innerHTML = '';

            if (miaMano) {
                miaMano.forEach(cartaStr => {
                    const card = creaElementoCarta(cartaStr);
                    if (cartaSelezionata === cartaStr) card.classList.add('selezionata');
                    card.onclick = () => {
                        cartaSelezionata = (cartaSelezionata === cartaStr) ? null : cartaStr;
                        renderizza(stato);
                    };
                    containerProprio.appendChild(card);
                });
            }

            const numAvversario = (mioRuolo === 1) ? (stato.mano_g2 ? stato.mano_g2.length : 0) : (stato.mano_g1 ? stato.mano_g1.length : 0);
            const containerAvv = document.getElementById('mano-avversario');
            containerAvv.innerHTML = '';
            for (let i = 0; i < numAvversario; i++) {
                const cop = document.createElement('div');
                cop.className = 'carta-coperta';
                containerAvv.appendChild(cop);
            }

            const eIlMioTurno = (stato.prio === mioRuolo);
            document.getElementById('btn-gioca').disabled = !cartaSelezionata || !eIlMioTurno || !stato.briscole;
        }

        function renderSlot(idSlot, cartaStr) {
            const slot = document.getElementById(idSlot);
            slot.innerHTML = '';
            if (cartaStr) slot.appendChild(creaElementoCarta(cartaStr));
        }

        function creaElementoCarta(cartaStr) {
            const parts = cartaStr.split(' ');
            const seme = parts[0];
            const valore = parts[1];
            const card = document.createElement('div');
            card.className = 'carta';
            const icona = { 'Denari': '♦', 'Coppe': '🍷', 'Spade': '⚔', 'Bastoni': '🪵' }[seme] || '';
            card.innerHTML = `<div>${valore}</div><div style="text-align:center; font-size:1.1rem;">${icona}</div><div style="text-align:right; font-size:0.65rem;">${seme}</div>`;
            return card;
        }

        async function scegliBriscola(seme) {
            await fetch('/api/scegli-briscola', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ seme: seme })
            });
            aggiornaStato();
        }

        async function inviaCarta() {
            if (!cartaSelezionata) return;
            await fetch('/api/gioca-carta', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ carta: cartaSelezionata })
            });
            cartaSelezionata = null;
            aggiornaStato();
        }

        async function resetStanza() {
            await fetch('/api/reset', { method: 'POST' });
            location.reload();
        }
    </script>
</body>
</html>
